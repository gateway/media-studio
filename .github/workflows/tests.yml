name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shared-python-onboarding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gateway/kie-api
          path: kie-api
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test runtime isolation and preservation
        run: node --test scripts/setup_python.test.mjs
      - name: Test macOS desktop launcher
        if: runner.os == 'macOS'
        run: node --test scripts/install_desktop_mac.test.mjs scripts/desktop_reopen.test.mjs
      - name: Install and verify shared Python without setup-python
        run: node scripts/setup_python.mjs . kie-api
      - name: Verify repeat setup
        run: node scripts/setup_python.mjs . kie-api

  publication-safeguards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify repository publication safeguards
        run: python scripts/test_repo_hygiene.py

  admin-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify admin design contracts
        run: |
          npm run test:admin-theme
          npm run quality:admin-theme

  windows-onboarding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify onboarding in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test_onboard_windows.ps1
      - name: Verify onboarding in PowerShell 7
        shell: pwsh
        run: ./scripts/test_onboard_windows.ps1

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Media Studio
        uses: actions/checkout@v5

      - name: Check out KIE API dependency
        uses: actions/checkout@v5
        with:
          repository: gateway/kie-api
          path: kie-api

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install shared Python environment
        run: |
          python -m venv kie-api/.venv
          kie-api/.venv/bin/pip install --upgrade pip
          kie-api/.venv/bin/pip install -e ./kie-api
          kie-api/.venv/bin/pip install -e ./apps/api[dev]
      - name: Test CI timing recorder without application fixtures
        run: kie-api/.venv/bin/python -m unittest discover -s scripts -p 'test_ci_pytest_profile*.py'

      - name: Test standalone unit bytecode policy without application imports
        run: kie-api/.venv/bin/python -B scripts/test_ci_bytecode_policy.py

      - name: Test recipe validation without application startup or databases
        run: kie-api/.venv/bin/python -B scripts/test_prompt_recipe_validation.py

      - name: Install web dependencies
        run: npm ci

      - name: Install isolated static analyzers
        run: |
          python -m venv .venv/static-analysis
          .venv/static-analysis/bin/python -m pip install -r scripts/static-analysis/requirements.txt

      - name: Use the Ubuntu archive for CI packages
        run: |
          # Avoid the stalled Azure mirror; retain APT's existing signing keys and suites.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Graph output text wrapping without application services
        run: node --test scripts/graph_text_wrapping.test.mjs

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run quality gates
        env:
          MEDIA_STUDIO_KIE_API_REPO_PATH: ${{ github.workspace }}/kie-api
          MEDIA_STUDIO_CI_PROFILE_DIR: ${{ runner.temp }}/quality-profile
        run: ./scripts/run-quality-gates

      - name: Retain complete backend timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-runtime-profile
          path: ${{ runner.temp }}/quality-profile
          if-no-files-found: error
